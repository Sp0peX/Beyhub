<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BEYBLADE X - Hub Arsenale</title>
    <style>
        :root {
            --bx-green: #00ff55;
            --bx-cyan: #00d4ff;
            --bg-base: #09090b;
            --panel-bg: #131316;
            --card-bg: #1c1c22;
            --text-main: #f4f4f5;
            --border-dim: #272730;
            --danger: #ff2a2a;
        }

        /* Impedisce la fastidiosa selezione del testo blu quando tappi velocemente sul cellulare */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-base);
            background-image: 
                linear-gradient(rgba(0, 255, 85, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 85, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            -webkit-user-select: none;
            user-select: none; 
        }

        h1 {
            font-size: 2em;
            font-style: italic;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
            background: linear-gradient(90deg, var(--bx-green), var(--bx-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 255, 85, 0.2);
            text-align: center;
        }

        h2 {
            font-size: 1.3em;
            font-style: italic;
            font-weight: 800;
            color: var(--text-main);
            border-bottom: 2px solid var(--bx-cyan);
            padding-bottom: 5px;
            margin-top: 0;
            text-transform: uppercase;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-dim);
            border-radius: 15px 0 15px 0;
            padding: 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 5px 15px rgba(0,0,0,0.4);
            position: relative;
            width: 100%;
            box-sizing: border-box;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--bx-green), var(--bx-cyan));
        }

        /* Contenitore per permettere lo scroll orizzontale su mobile senza rompere le 5 colonne */
        .table-scroll {
            width: 100%;
            overflow-x: auto;
            padding-bottom: 15px;
        }

        /* Griglia forzata a 5 colonne, non va mai a capo */
        .five-col-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(180px, 1fr));
            gap: 15px;
            min-width: 950px; /* Forza la larghezza per attivare lo scroll su mobile */
        }

        .input-group {
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px 0 8px 0;
            border: 1px solid var(--border-dim);
        }

        .input-group label {
            font-size: 0.85em;
            color: var(--bx-cyan);
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .col-box {
            background: var(--card-bg);
            border-radius: 8px 0 8px 0;
            border: 1px solid var(--border-dim);
            border-top: 4px solid;
            overflow: hidden;
        }
        
        .col-blades { border-top-color: #ff3366; }
        .col-main-blades { border-top-color: #ff9900; }
        .col-assist-blades { border-top-color: #cc33ff; }
        .col-ratchets { border-top-color: #ffd700; }
        .col-bits { border-top-color: #33ccff; }

        .col-box h3 { 
            font-size: 1em; 
            margin: 0; 
            padding: 10px;
            background: rgba(0,0,0,0.4);
            font-style: italic; 
            text-transform: uppercase;
            text-align: center;
        }

        ul { list-style-type: none; padding: 0; margin: 0; }
        li {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border-dim);
            font-size: 0.95em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        li:hover { background: rgba(255,255,255,0.03); }
        li:last-child { border-bottom: none; }

        /* Stile per i pezzi toccati/selezionati per la combo */
        li.active-part {
            background: rgba(0, 255, 85, 0.15);
            color: var(--bx-green);
            font-weight: 900;
            border-left: 4px solid var(--bx-green);
        }

        .del-part {
            color: var(--danger);
            cursor: pointer;
            font-weight: 900;
            font-family: monospace;
            padding: 5px 10px;
            background: rgba(255, 42, 42, 0.1);
            border-radius: 4px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border-dim);
            color: white;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.95em;
            box-sizing: border-box;
            outline: none;
            -webkit-appearance: none;
        }
        
        .input-group input { margin-bottom: 10px; }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, var(--bx-green), var(--bx-cyan));
            color: #000;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border: none;
            border-radius: 8px 0 8px 0;
            box-shadow: 0 4px 10px rgba(0, 255, 85, 0.2);
            margin-bottom: 10px;
        }

        button:active { transform: scale(0.98); }
        .btn-secondary { background: #2a2a35; color: #fff; box-shadow: none; }
        .btn-action { background: #33ccff; color: #000; }

        /* Barra di salvataggio combo */
        .save-combo-bar {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            background: rgba(0, 255, 85, 0.05);
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed var(--bx-green);
            align-items: center;
        }
        .save-combo-bar input { margin-bottom: 0; flex-grow: 1; }
        .save-combo-bar button { margin-bottom: 0; width: auto; padding: 12px 30px; }

        .combo-card {
            background: linear-gradient(135deg, var(--card-bg), var(--panel-bg));
            border: 1px solid var(--border-dim);
            border-left: 5px solid var(--bx-green);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 0 10px 0 10px;
            position: relative;
        }

        .combo-card h3 { margin: 0 0 10px 0; color: #fff; font-size: 1.2em; text-transform: uppercase; }
        
        .combo-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.9em;
            color: #ccc;
            font-weight: 600;
        }
        
        .combo-stats span {
            background: rgba(0,0,0,0.5);
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid var(--border-dim);
            text-align: center;
        }

        .delete-btn {
            position: absolute;
            top: 10px; right: 10px;
            width: auto;
            padding: 5px 12px;
            background: var(--danger);
            color: white;
            font-size: 0.8em;
            margin: 0;
        }

        .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }

        @media (max-width: 768px) {
            h1 { font-size: 1.6em; }
            .tools-grid { grid-template-columns: 1fr; }
            .save-combo-bar { flex-direction: column; }
            .save-combo-bar button { width: 100%; }
        }
    </style>
</head>
<body>

    <h1>BEYBLADE X HUD</h1>

    <div class="container">
        <div class="panel">
            <h2>1. Acquisizione Componenti</h2>
            <div class="table-scroll">
                <div class="five-col-grid">
                    <div class="input-group">
                        <label>Blade / Lock</label>
                        <input type="text" id="addBlade" placeholder="Es: Dran">
                        <button onclick="addPart('blades', 'addBlade')">Aggiungi</button>
                    </div>
                    <div class="input-group">
                        <label>Main Blade (CX)</label>
                        <input type="text" id="addMainBlade" placeholder="Es: Rage">
                        <button onclick="addPart('mainBlades', 'addMainBlade')">Aggiungi</button>
                    </div>
                    <div class="input-group">
                        <label>Assist Blade (CX)</label>
                        <input type="text" id="addAssistBlade" placeholder="Es: FE">
                        <button onclick="addPart('assistBlades', 'addAssistBlade')">Aggiungi</button>
                    </div>
                    <div class="input-group">
                        <label>Ratchet</label>
                        <input type="text" id="addRatchet" placeholder="Es: 4-55">
                        <button onclick="addPart('ratchets', 'addRatchet')">Aggiungi</button>
                    </div>
                    <div class="input-group">
                        <label>Bit (Punta)</label>
                        <input type="text" id="addBit" placeholder="Es: Taper">
                        <button onclick="addPart('bits', 'addBit')">Aggiungi</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel">
            <h2>2. Plancia di Assemblaggio</h2>
            <p style="color:#aaa; font-size:0.9em;">Tocca i componenti nelle colonne per incastrarli. Compila il nome e salva.</p>
            
            <div class="table-scroll">
                <div class="five-col-grid">
                    <div class="col-box col-blades">
                        <h3 style="color: #ff3366;">[ Blade / Lock ]</h3>
                        <ul id="listBlades"></ul>
                    </div>
                    <div class="col-box col-main-blades">
                        <h3 style="color: #ff9900;">[ Main Blade ]</h3>
                        <ul id="listMainBlades"></ul>
                    </div>
                    <div class="col-box col-assist-blades">
                        <h3 style="color: #cc33ff;">[ Assist Blade ]</h3>
                        <ul id="listAssistBlades"></ul>
                    </div>
                    <div class="col-box col-ratchets">
                        <h3 style="color: #ffd700;">[ Ratchet ]</h3>
                        <ul id="listRatchets"></ul>
                    </div>
                    <div class="col-box col-bits">
                        <h3 style="color: #33ccff;">[ Bit ]</h3>
                        <ul id="listBits"></ul>
                    </div>
                </div>
            </div>

            <div class="save-combo-bar">
                <input type="text" id="comboName" placeholder="Nome Tattico (es. Lo Zombie Mancino)">
                <button onclick="saveCombo()">Inizializza Deck</button
